[project]
name = "ruang-pangkas"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["Flask>=3.1,<4", "libsql==0.1.11", "pywebpush==2.5.0"]

[tool.vercel]
entrypoint = "backend.wsgi:app"

[tool.vercel.scripts]
build = "python -m scripts.build"

[tool.setuptools.packages.find]
include = ["backend*", "scripts*"]
